[build]
  command = "python3 scripts/build_netlify.py && node scripts/migrate-postgres.mjs --netlify-build"
  publish = "dist/site"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[template.environment]
  SMART_POWER_SETUP_KEY = "Private first-Admin setup key (use at least 24 random characters)"

  DATABASE_URL = "External PostgreSQL connection string (private; Builds and Functions scopes)"
