name: Verify website and download page

on:
  push:
    paths:
      - i/outputs/smart-power-dashboard/**
      - scripts/build_netlify.py
      - netlify/**
      - tests-netlify/**
      - package.json
      - package-lock.json
      - .github/workflows/website-check.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify public Android download page
        run: |
          test -f dist/site/download-app.html
          grep -F "Download Android APK" dist/site/download-app.html
          grep -F "releases/download/v1.1.3/" dist/site/download-app.html
